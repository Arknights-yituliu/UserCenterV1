server:
  port: 8080

spring:
  application:
    name: user-center
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user_center?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: root
  # Redis：会话 / 验证码 / 限流
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 3s
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # configuration:
    # 开发期输出 SQL 日志（当前暂不需要，需要时取消注释）
    # log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

tencent:
  secretId: xxx
  secretKey: xxx
  email:
    region: ap-guangzhou
    from-address: xxx@example.com
    template-id: 53553      

# ============ 业务自定义配置 ============
user-center:
  # 会话有效期（秒）：默认 180 天
  session-ttl-seconds: 15552000
  # 验证码有效期（秒）：默认 5 分钟
  code-ttl-seconds: 300
  # 验证码发送限流（秒）：同一邮箱/IP 的最小发送间隔
  code-send-interval-seconds: 60
  # 登录失败锁定：连续失败次数上限与锁定时间（秒）
  login-fail-limit: 5
  login-lock-seconds: 900
  # 同邮箱发送最小间隔（秒）：默认 5 分钟
  email-send-interval-seconds: 300
  # ===== OAuth2 授权服务器配置（第三方 Web 网站接入） =====
  oauth:
    # access_token 有效期（秒）：默认 2 小时
    access-token-ttl-seconds: 7200
    # refresh_token 有效期（秒）：默认 90 天
    refresh-token-ttl-seconds: 7776000
    # 授权码有效期（秒）：默认 5 分钟
    authorization-code-ttl-seconds: 300
    # 登录页地址：authorize 未登录时 302 跳转（纯前端接入；为空则保持抛 80001）
    login-page-url: http://localhost:8080/login.html
    # 跨站登录票据有效期（秒）：默认 5 分钟，一次性使用（登录页换取后随 authorize 携带）
    login-ticket-ttl-seconds: 300
    # CORS 跨域白名单（逗号分隔，来自 oauth_client 登记的网站 origin，仅对 /oauth2/** /auth/** /user/** 生效）
    allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.orange: debug
    # Mapper 层不打印 SQL（如需调试 SQL，改为 debug）
    com.orange.mapper: off
