server:
  port: 8080

spring:
  application:
    name: user-center
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user_center?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: root
  # Redis：会话 / 验证码 / 限流
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 3s
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # configuration:
    # 开发期输出 SQL 日志（当前暂不需要，需要时取消注释）
    # log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

tencent:
  secretId: xxx
  secretKey: xxx
  email:
    region: ap-guangzhou
    from-address: xxx@example.com
    # 验证码邮件模板：注册 57132，登录 57133，重置/换绑等其他沿用 53553
    template-id: 53553
    register-template-id: 57132
    login-template-id: 57133

# ============ 业务自定义配置 ============
user-center:
  # 会话有效期（秒）：默认 180 天
  session-ttl-seconds: 7776000
  # 验证码有效期（秒）：默认 5 分钟
  code-ttl-seconds: 300
  # 验证码发送限流（秒）：同一邮箱/IP 的最小发送间隔
  code-send-interval-seconds: 60
  # 登录失败锁定：连续失败次数上限与锁定时间（秒）
  login-fail-limit: 5
  login-lock-seconds: 900
  # 同邮箱发送最小间隔（秒）：默认 1分钟
  email-send-interval-seconds: 60
  # ===== OAuth2 授权服务器配置（第三方 Web 网站接入） =====
  oauth:
    # OAuth 客户端注册或更新后的管理员通知邮箱；留空则不发送
    admin-email: xxx@example.com
    # access_token 有效期（秒）：默认 2 小时
    access-token-ttl-seconds: 7200
    # refresh_token 有效期（秒）：默认 90 天
    refresh-token-ttl-seconds: 7776000
    # 授权码有效期（秒）：默认 5 分钟
    authorization-code-ttl-seconds: 300
    # 登录页地址：authorize 未登录时 302 跳转（纯前端接入；为空则保持抛 80001）
    login-page-url: http://localhost:8080/login.html
    # 跨站登录票据有效期（秒）：默认 5 分钟，一次性使用（登录页换取后随 authorize 携带）
    login-ticket-ttl-seconds: 300
    # 授权确认页地址：requireAuthConsent=1 的客户端授权时 302 跳转（纯前端页面接入）
    consent-page-url: http://localhost:5000/oauth2/consent
    # 授权确认单有效期（秒）：默认 5 分钟
    consent-ttl-seconds: 300
    # 直连登录 / 注册限流（固定窗口）与登录失败渐进锁定
    direct-rate-limit:
      session:
        # 单 IP / 单 client+IP 发起会话上限，以及统计窗口（秒）
        ip-limit: 60
        client-ip-limit: 20
        window-seconds: 60
      login:
        # 单 IP 提交登录上限，以及统计窗口（秒）
        ip-request-limit: 30
        ip-request-window-seconds: 60
        # 同一 IP 或账号失败次数的统计窗口（秒）
        failure-window-seconds: 900
        # 失败次数达到阈值后，按级别锁定（秒）
        first-lock-threshold: 5
        first-lock-seconds: 60
        second-lock-threshold: 10
        second-lock-seconds: 300
        third-lock-threshold: 15
        third-lock-seconds: 900
      register:
        # 单 IP / 单邮箱注册上限，以及统计窗口（秒）
        ip-limit: 10
        email-limit: 3
        window-seconds: 3600
    # oauth_client_origin 审批白名单的本地缓存刷新周期（毫秒）
    origin-cache-refresh-ms: 60000
    # 单个开发者账号可注册的 OAuth 客户端数量上限（默认 10）
    max-clients-per-owner: 5

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

logging:
  level:
    com.orange: debug
    # Mapper 层不打印 SQL（如需调试 SQL，改为 debug）
    com.orange.mapper: off
