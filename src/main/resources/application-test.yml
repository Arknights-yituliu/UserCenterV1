server:
  port: 8080

spring:
  application:
    name: user-center
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user_center?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: root
  # Redis：会话 / 验证码 / 限流
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 3s
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # configuration:
    # 开发期输出 SQL 日志（当前暂不需要，需要时取消注释）
    # log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

tencent:
  secretId: xxx
  secretKey: xxx
  email:
    region: ap-guangzhou
    from-address: xxx@example.com
    # 验证码邮件模板：注册 57132，登录 57133，重置/换绑等其他沿用 53553
    template-id: 53553
    register-template-id: 57132
    login-template-id: 57133
  # 数据万象文本同步审核：填好存储桶和审核策略后再启用
  ci:
    enabled: false
    # 必须与绑定数据万象的存储桶地域一致
    region: ap-guangzhou
    # 完整存储桶名称，包含 APPID 后缀，例如 audit-1250000000
    bucket: ""
    # 审核策略 ID；留空时使用云端默认策略
    biz-type: ""
    # 以下超时单位均为毫秒
    connection-timeout-ms: 3000
    socket-timeout-ms: 5000
    request-timeout-ms: 8000
    # 不配置独立密钥时，复用上面的 tencent.secretId / tencent.secretKey
    # secret-id: ${CI_SECRET_ID}
    # secret-key: ${CI_SECRET_KEY}

# OAuth2 通知与页面地址；令牌等有效期在 OAuthProperties 中维护
oauth:
  # OAuth 客户端注册或更新后的管理员通知邮箱；留空则不发送
  admin-email: xxx@example.com
  # authorize 未登录时跳转的登录页地址；留空则返回未登录错误
  login-page-url: http://localhost:8080/login.html
  # requireAuthConsent=1 的客户端授权时跳转的确认页地址
  consent-page-url: http://localhost:5000/oauth2/consent

# ============ 业务自定义配置 ============
# 会话、验证码、登录锁定和主站限流在 UserAccentProperties 中维护
# 直连登录、注册和渐进锁定在 OAuthDirectProperties 中维护
# OAuth2 有效期、缓存刷新周期及客户端数量上限在 OAuthProperties 中维护

# ===== 迁移兑换端点（POST /oauth2/internal/migrate-token）=====
# 该端点跨公网可达，认证层（Ed25519 验签）是唯一屏障，其余为加固项
migrate:
  # 总开关：默认关闭，上线时显式打开，存量迁移结束后立即关闭
  enabled: false
  # 强制 HTTPS：非 HTTPS 直接拒绝；仅本地联调可临时置 false
  require-https: true
  # 认证方式：本期固定 ed25519
  auth-mode: ed25519
  # 允许的时间偏移（秒）：公网暴露下取小值，同时决定 nonce 的 TTL（该值 ×2）
  clock-skew-seconds: 120
  # 限流：应用层按 IP / uid / client 三个维度（网关层另有按 IP 限流）
  per-ip-per-minute: 600
  per-uid-per-minute: 5
  per-client-per-minute: 3000
  # kid → Ed25519 公钥（Base64 的 X.509 SubjectPublicKeyInfo）映射，格式：k1=base64,k2=base64
  # UC 侧只存公钥，从环境变量注入，绝不写进仓库；轮换期可同时配置新旧多把公钥
  verify-keys: ""

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

logging:
  level:
    com.orange: debug
    # Mapper 层不打印 SQL（如需调试 SQL，改为 debug）
    com.orange.mapper: off
