server:
  port: 8080

spring:
  application:
    name: user-center
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/user_center?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  # Redis：会话 / 验证码 / 限流
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 3s
  # 邮件：发送邮箱验证码
  mail:
    host: smtp.example.com
    port: 465
    username: noreply@example.com
    password: your-smtp-password
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  # 禁止启动时自动执行建表脚本（表结构由 DBA 手动执行 db/schema.sql）
  sql:
    init:
      mode: never
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  # 实体类扫描路径
  type-aliases-package: com.orange.entity.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted

# ============ 业务自定义配置 ============
uc:
  # 会话有效期（秒）：默认 180 天
  session-ttl-seconds: 15552000
  # 验证码有效期（秒）：默认 5 分钟
  code-ttl-seconds: 300
  # 验证码发送限流（秒）：同一邮箱/IP 的最小发送间隔
  code-send-interval-seconds: 60
  # 登录失败锁定：连续失败次数上限与锁定时间（秒）
  login-fail-limit: 5
  login-lock-seconds: 900
  # 签名时间窗（秒）：允许的时间戳偏差
  sign-window-seconds: 300
  # 同邮箱发送最小间隔（秒）：默认 5 分钟
  email-send-interval-seconds: 300
  # ===== OAuth2 授权服务器配置（第三方 Web 网站接入） =====
  oauth:
    # access_token 有效期（秒）：默认 2 小时
    access-token-ttl-seconds: 7200
    # refresh_token 有效期（秒）：默认 30 天
    refresh-token-ttl-seconds: 2592000
    # 授权码有效期（秒）：默认 5 分钟
    authorization-code-ttl-seconds: 300
    # 登录页地址：authorize 未登录时 302 跳转（纯前端接入；为空则保持抛 80001）
    login-page-url: http://localhost:8080/login.html
    # 会话 Cookie 所属域名（可空：不设置则绑定当前主机）
    cookie-domain:
    # 会话 Cookie 是否仅 HTTPS 传输（本地 HTTP 开发设为 false）
    cookie-secure: false
    # CORS 跨域白名单（逗号分隔，来自 oauth_client 登记的网站 origin，仅对 /oauth2/** 生效）
    allowed-origins: http://localhost:3000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.orange: debug
