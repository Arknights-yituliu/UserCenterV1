<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心登录</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f7fa; margin: 0; }
        .card { max-width: 360px; margin: 12vh auto; background: #fff; border-radius: 8px;
                padding: 32px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        h1 { font-size: 20px; text-align: center; margin: 0 0 24px; color: #1f2329; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #4e5969; margin-bottom: 6px; }
        input { width: 100%; box-sizing: border-box; padding: 9px 12px; border: 1px solid #dcdfe6;
                border-radius: 4px; font-size: 14px; outline: none; }
        input:focus { border-color: #3370ff; }
        button { width: 100%; padding: 10px; background: #3370ff; color: #fff; border: none;
                 border-radius: 4px; font-size: 15px; cursor: pointer; margin-top: 8px; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .tip { font-size: 12px; color: #86909c; text-align: center; margin-top: 16px; }
        .error { color: #f53f3f; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>一图流用户中心登录</h1>
    <div class="field">
        <label for="email">邮箱</label>
        <input id="email" type="email" placeholder="请输入邮箱" autocomplete="username">
    </div>
    <div class="field">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div class="error" id="error"></div>
    <button id="loginBtn">登 录</button>
    <div class="tip">登录成功后返回原网站继续授权</div>
</div>

<script>
    // 解析回跳地址（原 authorize 地址），登录成功后 302 回跳，此时浏览器已携带 uc_token Cookie
    var redirect = new URLSearchParams(window.location.search).get('redirect') || '/';

    var btn = document.getElementById('loginBtn');
    btn.addEventListener('click', doLogin);

    // 回车登录
    document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { doLogin(); }
    });

    async function doLogin() {
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var errorEl = document.getElementById('error');
        errorEl.style.display = 'none';

        if (!email || !password) {
            showError('请输入邮箱和密码');
            return;
        }
        btn.disabled = true;
        try {
            var resp = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ registerType: 'password', email: email, password: password })
            });
            var data = await resp.json();
            if (data.code === 200) {
                // 登录成功：后端已通过 Set-Cookie 写入 uc_token（HttpOnly），浏览器自动保存
                window.location.href = redirect;
            } else {
                showError(data.msg || '登录失败');
                btn.disabled = false;
            }
        } catch (e) {
            showError('网络异常，请重试');
            btn.disabled = false;
        }
    }

    function showError(msg) {
        var el = document.getElementById('error');
        el.textContent = msg;
        el.style.display = 'block';
    }
</script>
</body>
</html>
